[project]
name = "pbip-merge"
version = "0.1.0"
description = "Visual before/after diff of Power BI PBIP (PBIR) reports across git revisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pbip-diff = "pbip_diff.cli:main"
pbip-merge = "pbip_diff.mergecli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pbip_diff"
